<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Cart | Deshi Zaiqa</title>
<meta name="theme-color" content="#ff5722">
<link rel="icon" href="assets/images/favicon.ico">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/auth.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

<div id="navbar-placeholder"></div>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="container">
    <h2>🛒 Your Cart</h2>
    <p>Review your items and place your order</p>
  </div>
</div>

<div class="container pb-5">

  <div id="empty-cart" class="alert alert-warning d-none" style="border-radius:12px;">
    Your cart is empty 😔 — <a href="menu.html" class="alert-link">Browse our menu</a>
  </div>

  <div class="table-responsive">
    <table class="table table-bordered text-center" id="cart-table">
      <thead>
        <tr>
          <th>Item</th>
          <th>Qty</th>
          <th>Price</th>
          <th>Total</th>
          <th>Remove</th>
        </tr>
      </thead>
      <tbody id="cart-items"></tbody>
    </table>
  </div>

  <div class="cart-summary" id="cart-summary-bar" style="display:none;">
    <div>
      <div class="cart-total-label">Grand Total</div>
      <div class="cart-total-amount" id="grand-total-amount">₹0</div>
    </div>
    <div class="cart-actions">
      <button class="btn btn-danger" onclick="clearCart()">Clear Cart</button>
      <button class="btn btn-success px-4" onclick="placeOrder()">Place Order on WhatsApp 💬</button>
    </div>
  </div>

</div>

<div id="footer-placeholder"></div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/components.js"></script>
<script src="assets/js/script.js"></script>
</body>
</html>
