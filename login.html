<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | Deshi Zaiqa</title>
<meta name="theme-color" content="#ff5722">
<link rel="icon" href="assets/images/favicon.ico">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="assets/css/auth.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body class="login-body">

<div class="login-wrap">
  <div class="login-card">

    <!-- Brand -->
    <a href="index.html" class="login-brand">
      <span class="login-logo">🍽</span>
      <div>
        <h4>Deshi Zaiqa</h4>
        <small>Apna Desi Adda — Nari Village, Nalanda</small>
      </div>
    </a>

    <!-- Role Tabs -->
    <div class="login-tabs">
      <button class="ltab active" id="tab-cust" onclick="switchTab('cust')">🛒 Customer</button>
      <button class="ltab" id="tab-admin" onclick="switchTab('admin')">⚙️ Admin</button>
    </div>

    <!-- ===== CUSTOMER PANEL ===== -->
    <div id="panel-cust">
      <p class="login-hint">Enter your name &amp; mobile number to join or continue. No password needed!</p>

      <div class="mb-3">
        <label class="form-label fw-semibold">Your Name</label>
        <input type="text" id="cust-name" class="form-control" placeholder="e.g. Rahul Kumar" autocomplete="name">
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Mobile Number</label>
        <div class="input-group">
          <span class="input-group-text">+91</span>
          <input type="tel" id="cust-phone" class="form-control" placeholder="10-digit number" maxlength="10" autocomplete="tel-national" inputmode="numeric">
        </div>
      </div>

      <button class="btn-login-submit" onclick="customerLogin()">Join / Continue →</button>
      <p class="login-terms">Your number is used only to identify you during ordering. We don't share it with anyone.</p>
    </div>

    <!-- ===== ADMIN PANEL ===== -->
    <div id="panel-admin" class="d-none">
      <p class="login-hint">Admin access only. Signup is not available for admin accounts.</p>

      <div class="mb-3">
        <label class="form-label fw-semibold">Username</label>
        <input type="text" id="admin-user" class="form-control" placeholder="Admin username" autocomplete="off">
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold">Password</label>
        <div class="input-group">
          <input type="password" id="admin-pass" class="form-control" placeholder="Password" autocomplete="current-password">
          <button class="btn btn-outline-secondary" type="button" onclick="togglePass()" title="Show/hide password">👁</button>
        </div>
      </div>

      <button class="btn-login-submit" onclick="adminLogin()">Login as Admin</button>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="assets/js/auth.js"></script>
<script>
  // Redirect already-logged-in users
  if (Auth.isAdmin()) window.location.href = 'admin.html';
  else if (Auth.isCustomer()) window.location.href = 'index.html';

  function switchTab(tab) {
    ['cust', 'admin'].forEach(t => {
      document.getElementById('panel-' + t).classList.add('d-none');
      document.getElementById('tab-' + t).classList.remove('active');
    });
    document.getElementById('panel-' + tab).classList.remove('d-none');
    document.getElementById('tab-' + tab).classList.add('active');
  }

  function toast(icon, title) {
    Swal.fire({ toast: true, position: 'top-end', icon, title, showConfirmButton: false, timer: 2200, timerProgressBar: true });
  }

  function customerLogin1() {
    const name  = document.getElementById('cust-name').value.trim();
    const phone = document.getElementById('cust-phone').value.trim();

    if (!name) { toast('warning', 'Please enter your name'); return; }
    if (!/^\d{10}$/.test(phone)) { toast('warning', 'Enter a valid 10-digit mobile number'); return; }

    Auth.loginCustomer(name, phone);

    Swal.fire({
      icon: 'success',
      title: `Welcome, ${name}! 🎉`,
      text: 'You are now logged in',
      confirmButtonColor: '#ff5722',
      timer: 1800,
      showConfirmButton: false
    }).then(() => { window.location.href = 'index.html'; });
  }

  async function customerLogin() {
  const name  = document.getElementById('cust-name').value.trim();
  const phone = document.getElementById('cust-phone').value.trim();

  if (!name) { 
    toast('warning', 'Please enter your name'); 
    return; 
  }

  if (!/^\d{10}$/.test(phone)) { 
    toast('warning', 'Enter a valid 10-digit mobile number'); 
    return; 
  }

  try {
    const response = await fetch('https://deshizaiqa-backend.onrender.com/api/users', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        userName: name,
        phoneNumber: phone,
        role: "customer"
      })
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(data || 'Something went wrong');
    }
    Auth.loginCustomer(name, phone);
    // ✅ Store logged-in user
    localStorage.setItem('customer', JSON.stringify(data));

    // ✅ Detect new vs returning user
    const welcomeText = data?.userName 
      ? `Welcome, ${data.userName}! 🎉`
      : `Welcome! 🎉`;

    Swal.fire({
      icon: 'success',
      title: welcomeText,
      text: 'You are now logged in',
      confirmButtonColor: '#ff5722',
      timer: 1800,
      showConfirmButton: false
    }).then(() => { 
      window.location.href = 'index.html'; 
    });

  } catch (error) {
    console.error(error);
    toast('error', 'Unable to login. Please try again.');
  }
}

  function adminLogin() {
    const user = document.getElementById('admin-user').value.trim();
    const pass = document.getElementById('admin-pass').value;

    if (!user || !pass) { toast('warning', 'Please fill in all fields'); return; }

    if (Auth.loginAdmin(user, pass)) {
      Swal.fire({
        icon: 'success',
        title: 'Welcome, Admin ⚙️',
        confirmButtonColor: '#ff5722',
        timer: 1500,
        showConfirmButton: false
      }).then(() => { window.location.href = 'admin.html'; });
    } else {
      Swal.fire({ icon: 'error', title: 'Invalid credentials', text: 'Check username and password', confirmButtonColor: '#ff5722' });
      document.getElementById('admin-pass').value = '';
    }
  }

  function togglePass() {
    const el = document.getElementById('admin-pass');
    el.type = el.type === 'password' ? 'text' : 'password';
  }

  // Enter key support
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (!document.getElementById('panel-admin').classList.contains('d-none')) adminLogin();
    else customerLogin();
  });
</script>

</body>
</html>
